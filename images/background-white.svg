<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#cccccc" stop-opacity="0"/>
      <stop offset="90%" stop-color="#cccccc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#cccccc" stop-opacity="0"/>
    </radialGradient>

    <filter id="letterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="circuitGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="122" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="125" fill="url(#ringGlow)"/>

  <!-- Circuiti di sfondo in grigio -->
  <g stroke="#d0d0d0" stroke-width="0.8" opacity="0.25" fill="none">
    <line x1="20" y1="80" x2="236" y2="80"/>
    <line x1="20" y1="176" x2="236" y2="176"/>
    <line x1="80" y1="20" x2="80" y2="236"/>
    <line x1="176" y1="20" x2="176" y2="236"/>
    <circle cx="80" cy="80" r="3" fill="#d0d0d0"/>
    <circle cx="176" cy="176" r="3" fill="#d0d0d0"/>
  </g>

  <!-- LETTERE RT in scala di grigi -->
  <g filter="url(#letterGlow)">
    <rect x="62" y="83" width="11" height="90" rx="2" fill="#9c9c9c"/>
    <rect x="62" y="83" width="52" height="11" rx="2" fill="#9c9c9c"/>
    <rect x="103" y="83" width="11" height="46" rx="2" fill="#9c9c9c"/>
    <rect x="62" y="118" width="52" height="11" rx="2" fill="#9c9c9c"/>
    <polygon points="103,129 114,129 136,173 125,173" fill="#9c9c9c"/>

    <rect x="138" y="83" width="60" height="11" rx="2" fill="#9c9c9c"/>
    <rect x="162" y="83" width="12" height="90" rx="2" fill="#9c9c9c"/>
  </g>

  <!-- CIRCUITI sulle RT in grigio chiaro -->
  <g filter="url(#circuitGlow)" stroke="#d0d0d0" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="67,83 67,72 52,72 52,58 40,58" stroke-width="1.2" opacity="0.9"/>
    <circle cx="52" cy="72" r="2.2" fill="#d0d0d0" stroke="none"/>
    <circle cx="40" cy="58" r="3" fill="none" stroke="#d0d0d0" stroke-width="1.2"/>
    <circle cx="40" cy="58" r="1.2" fill="#ffffff" stroke="none"/>

    <polyline points="108,88 108,72 128,72 128,58 148,58" stroke-width="1.2" opacity="0.9"/>
    <circle cx="128" cy="72" r="2.2" fill="#d0d0d0" stroke="none"/>
    <circle cx="148" cy="58" r="3" fill="none" stroke="#d0d0d0" stroke-width="1.2"/>
    <circle cx="148" cy="58" r="1.2" fill="#ffffff" stroke="none"/>

    <polyline points="114,123 128,123 128,138 148,138" stroke-width="1.2" opacity="0.85"/>
    <circle cx="128" cy="123" r="2.2" fill="#d0d0d0" stroke="none"/>
    <circle cx="148" cy="138" r="2.5" fill="none" stroke="#d0d0d0" stroke-width="1.2"/>
    <circle cx="148" cy="138" r="1" fill="#ffffff" stroke="none"/>

    <polyline points="120,168 108,168 108,183 88,183 88,198" stroke-width="1.2" opacity="0.85"/>
    <circle cx="108" cy="183" r="2.2" fill="#d0d0d0" stroke="none"/>
    <rect x="85" y="195" width="6" height="6" rx="1" fill="#d0d0d0" stroke="none" opacity="0.9"/>

    <polyline points="148,88 148,72 162,72 162,58" stroke-width="1.2" opacity="0.9"/>
    <circle cx="148" cy="72" r="2.2" fill="#d0d0d0" stroke="none"/>
    <circle cx="162" cy="58" r="3" fill="none" stroke="#d0d0d0" stroke-width="1.2"/>
    <circle cx="162" cy="58" r="1.2" fill="#ffffff" stroke="none"/>

    <polyline points="192,88 192,72 208,72 208,58 216,58" stroke-width="1.2" opacity="0.9"/>
    <circle cx="208" cy="72" r="2.2" fill="#d0d0d0" stroke="none"/>
    <circle cx="216" cy="58" r="3" fill="none" stroke="#d0d0d0" stroke-width="1.2"/>
    <circle cx="216" cy="58" r="1.2" fill="#ffffff" stroke="none"/>

    <polyline points="174,168 174,183 194,183 194,198 208,198" stroke-width="1.2" opacity="0.85"/>
    <circle cx="194" cy="183" r="2.2" fill="#d0d0d0" stroke="none"/>
    <rect x="205" y="195" width="6" height="6" rx="1" fill="#d0d0d0" stroke="none" opacity="0.9"/>

    <polyline points="162,168 162,183 148,183 148,198" stroke-width="1.2" opacity="0.75"/>
    <circle cx="148" cy="183" r="2.2" fill="#d0d0d0" stroke="none"/>
    <circle cx="148" cy="198" r="2" fill="#aaaaaa" stroke="none" opacity="0.8"/>

    <circle cx="67" cy="123" r="2" fill="#ffffff" stroke="none" opacity="0.8"/>
    <circle cx="168" cy="88" r="2" fill="#ffffff" stroke="none" opacity="0.8"/>
  </g>
</svg>
